apply plugin: 'com.android.library'

android {
    namespace 'com.ankitsharma.utsavnights.clips'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }

    // Unity's .androidlib keeps the manifest, sources and resources at the library root.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
