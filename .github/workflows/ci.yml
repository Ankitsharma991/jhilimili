# Phase 1 CI: EditMode tests on every push and PR, then an Android AAB build.
# Requires repository secrets UNITY_LICENSE (contents of your Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
# See Docs/Phase1/CI.md. GameCI image availability for the exact editor version is [Verify].
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-tests-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+UtsavNights.*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  android-build:
    name: Android AAB
    needs: editmode-tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (Android build needs it)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-android-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          androidExportType: androidAppBundle
          buildMethod: UtsavNights.EditorTools.BuildScript.CiReleaseAab

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: Builds/Android
